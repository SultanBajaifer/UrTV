name: Checks

# tests/run.sh on every push: build, data, photos, fonts, scripts, private data, and the screen
# in a real browser. The Android apps are compiled by android.yml.
on:
  push:
    branches: [master, next, content]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # pull requests from forks run here too: read-only, and no secrets are used

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 22
      - run: pip install fonttools==4.67.0 brotli==1.2.1 pillow==12.3.0 cryptography==50.0.2
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: tests/run.sh
