name: Checks

# tests/run.sh on every push: build, data, photos, fonts, scripts, private data, and the screen
# in a real browser. The Android apps are compiled by android.yml.
on:
  push:
    branches: [master, next, content]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # pull requests from forks run here too: read-only (GitHub gives them no secrets, so no fonts)

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      # Thmanyah's licence allows its files only inside a built product: they come from a private fonts repository
      # (repository variable FONTS_REPO, secret FONTS_TOKEN: a read-only token for it), never from this repository.
      # Without them the build goes on and the screen falls back to the system's Arabic font.
      - name: Is there a fonts repository?
        id: fonts
        env:
          TOKEN: ${{ secrets.FONTS_TOKEN }}
          REPO: ${{ vars.FONTS_REPO }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$REPO" ]; then echo "have=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::No FONTS_REPO/FONTS_TOKEN: building without Thmanyah (system Arabic font)"; echo "have=0" >> "$GITHUB_OUTPUT"; fi
      - if: steps.fonts.outputs.have == '1'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          repository: ${{ vars.FONTS_REPO }}
          token: ${{ secrets.FONTS_TOKEN }}
          path: .fonts-private
          persist-credentials: false
      - name: Private fonts
        if: steps.fonts.outputs.have == '1'
        run: |
          cp .fonts-private/web/*.woff2 assets/fonts/
          mkdir -p android/launcher/src/main/assets/fonts
          cp .fonts-private/android/*.otf android/launcher/src/main/assets/fonts/
          rm -rf .fonts-private
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 22
      # a Python of its own: pip then installs into its site-packages, which python -I still sees (optimize/ runs its
      # scripts with -I, like the venv does on people's computers); the runner's system pip went to the user's folder
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install fonttools==4.67.0 brotli==1.2.1 pillow==12.3.0 cryptography==50.0.2
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: tests/run.sh
