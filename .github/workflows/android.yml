name: Build APKs

on:
  push:
    branches: [master, next]   # next: a test build in apk-next, before anything reaches apk-latest
    paths: ['src/**', 'assets/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Build the page
        run: python3 src/build.py

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1   # v4.4.4
        with:
          gradle-version: '8.9'

      # the signing key lives only in the repository's secrets (made once with .github/tools/make_signing_key.py)
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD must both be in the repository's secrets"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          URTV_BRANCH: ${{ github.ref_name }}   # the screensaver fetches its page from the branch it was built from
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk urtv-screensaver.apk
          cp android/launcher/build/outputs/apk/release/launcher-release.apk urtv-home.apk

      # apksigner, not keytool: the home APK has no v1 (JAR) signature, so keytool sees no signer in it
      - name: Which key signed them
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in urtv-screensaver.apk urtv-home.apk; do
            echo "$f:"; "$apksigner" verify --print-certs "$f" | grep -m2 -E 'certificate (DN|SHA-256)'
          done

      # optimize/install.sh refuses an APK that is not listed here with the same SHA-256
      - name: Checksums
        run: sha256sum urtv-screensaver.apk urtv-home.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: apks
          path: |
            urtv-screensaver.apk
            urtv-home.apk
            SHA256SUMS.txt

      # fixed download links: .../releases/download/apk-latest/urtv-screensaver.apk and urtv-home.apk
      - name: Publish to the apk-latest release
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2.6.2
        with:
          tag_name: apk-latest
          name: Latest APKs
          body: "Both apps at version 3.${{ github.run_number }}, built from ${{ github.sha }}"
          files: |
            urtv-screensaver.apk
            urtv-home.apk
            SHA256SUMS.txt
          make_latest: true

      # and every build kept under its own number, the apps' version: APK_TAG=v3.N optimize/install.sh all
      - name: Publish to the numbered release
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2.6.2
        with:
          tag_name: v3.${{ github.run_number }}
          name: UrTV 3.${{ github.run_number }}
          body: "Both apps at version 3.${{ github.run_number }}, built from ${{ github.sha }}"
          files: |
            urtv-screensaver.apk
            urtv-home.apk
            SHA256SUMS.txt
          make_latest: false

      # next: one test release, replaced by each build; install with APK_TAG=apk-next optimize/install.sh all
      - name: Publish to the apk-next test release
        if: github.ref_name == 'next'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2.6.2
        with:
          tag_name: apk-next
          name: Test build from next
          body: "Both apps at version 3.${{ github.run_number }}, built from next at ${{ github.sha }}. For testing only."
          files: |
            urtv-screensaver.apk
            urtv-home.apk
            SHA256SUMS.txt
          prerelease: true
          make_latest: false
